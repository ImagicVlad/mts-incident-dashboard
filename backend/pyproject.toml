[project]
name = "mts-incident-dashboard"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.35,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "watchfiles>=1.1,<2",
    "httpx>=0.28,<1",
    "argon2-cffi>=25.1,<26",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

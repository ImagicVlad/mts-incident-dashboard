name: Verify incident console
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm test
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - name: Verify with a temporary account
        run: |
          export SMOKE_LOGIN="ci.smoke"
          export SMOKE_PASSWORD="$(openssl rand -hex 24)"
          printf '%s\n' "$SMOKE_PASSWORD" | docker compose exec -T backend .venv/bin/python -m app.accounts create --login "$SMOKE_LOGIN" --display-name "CI Smoke" --role coordinator --password-stdin
          python3 scripts/smoke.py
      - if: always()
        run: docker compose logs --tail=30 && docker compose down
